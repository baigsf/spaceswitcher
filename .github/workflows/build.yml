name: Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: |
          chmod +x dist/build.sh
          ./dist/build.sh

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Create DMG
        run: |
          chmod +x dist/deploy-to-dmg.sh
          ./dist/deploy-to-dmg.sh

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: InstantSpaceSwitcher-dmg
          path: build/InstantSpaceSwitcher-*.dmg
